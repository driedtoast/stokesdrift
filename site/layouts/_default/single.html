{{ define "main" }}
<article class="max-w-3xl mx-auto px-6 lg:px-12 py-24">
  <h1 class="text-3xl sm:text-4xl font-display font-semibold text-on-surface leading-tight">{{ .Title }}</h1>
  {{ if .Params.description }}
  <p class="mt-4 text-secondary">{{ .Params.description }}</p>
  {{ end }}
  <div class="mt-8 prose prose-lg max-w-none text-on-surface">
    {{ .Content }}
  </div>
</article>
{{ end }}
